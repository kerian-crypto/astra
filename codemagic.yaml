# Build iOS sans App Store : produit un .ipa NON signé à télécharger
# depuis l'onglet Artifacts du build. Il doit être signé à l'installation
# (Sideloadly / AltStore avec un identifiant Apple).
workflows:
  ios-ipa:
    name: ASTRA Hub iOS (.ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      flutter: 3.47.5
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: https://astra.digital-get.com/api/v1
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Config Firebase (optionnelle)
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST absent : build sans notifications push."
          fi
      - name: Dépendances
        script: flutter pub get
      - name: Build iOS (non signé)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Empaquetage .ipa
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr astra_hub.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/ipa/*.ipa
