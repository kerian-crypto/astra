name: astra-hub

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY manquant}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      UPLOAD_DIR: /data/uploads
      # ASTRA AI : Ronda (llama-server) sur la machine hôte. Vide = IA désactivée.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
      AI_API_KEY: ${AI_API_KEY:-}
      # Notifications push : compte de service Firebase déposé dans
      # infra/secrets/ (jamais versionné). Vide = push désactivé.
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
    extra_hosts:
      # Permet au conteneur de joindre un service de l'hôte (Ronda).
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
      - ./secrets:/run/secrets/astra:ro
    ports:
      - "8000:8000"

volumes:
  db-data:
  uploads:
