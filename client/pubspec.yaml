name: astra_client
description: "Astra Client — l'espace numérique privé des clients d'Astra."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.1.0
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  web_socket_channel: ^3.0.3
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  package_info_plus: ^10.2.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
