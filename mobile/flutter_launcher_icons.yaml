# Icône de l'application : le « A » du logo Astra.
# Régénérer après modification : dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#05070E"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
